services:
  - type: web
    name: fast-track-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JUDGE_PIN
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: CORS_ORIGIN
        sync: false
